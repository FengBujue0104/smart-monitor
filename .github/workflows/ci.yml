name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        go: ['1.26.x']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 主包测试只操作内存模拟数据，不读真实磁盘，普通权限即可运行。
      # （若仓库根目录残留 rsrc.syso，build.bat 已自动清理。）
      - name: Test
        run: go test ./... -count=1

      # race 检测覆盖纯逻辑包（health/smart/ui 无 GUI 消息循环，可安全运行）。
      # 主包含 walk GUI 初始化，不在 race 范围内。
      - name: Race
        run: go test -race -count=1 ./health/ ./smart/ ./ui/
